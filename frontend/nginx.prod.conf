# Production Nginx config — mounted over /etc/nginx/conf.d/default.conf by
# docker-compose.prod.yml. Serves the React SPA over HTTPS, proxies the API and
# WebSocket to the api container, and keeps the ACME challenge path open for
# Let's Encrypt renewals.

# ─── HTTP :80 — ACME challenge + redirect to HTTPS ──────────────────────────
server {
    listen 80;
    server_name my-noteg.com www.my-noteg.com;

    # Let certbot complete the webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS :443 — the application ───────────────────────────────────────────
server {
    listen 443 ssl;
    server_name my-noteg.com www.my-noteg.com;

    ssl_certificate     /etc/letsencrypt/live/my-noteg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my-noteg.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy WebSocket connections
    location /ws {
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
